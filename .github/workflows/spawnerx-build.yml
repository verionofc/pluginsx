name: SpawnerX build and verify

on:
  push:
    paths:
      - "plugins"
      - "plugins/**"
      - "builds/**"
      - ".github/workflows/spawnerx-build.yml"
  pull_request:
    paths:
      - "plugins"
      - "plugins/**"
      - "builds/**"
      - ".github/workflows/spawnerx-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and plugin source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build, verify targets, and generate release catalogs
        working-directory: plugins/SpawnerX
        run: ./gradlew --no-daemon check

      - name: Upload build report, catalogs, and plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: spawnerx-paper-artifacts
          path: |
            plugins/SpawnerX/build/reports/paper-targets.txt
            builds/releases.json
            builds/SpawnerX/releases.json
            builds/SpawnerX/**/*.jar
          if-no-files-found: error
